appId: com.superlocal.launcher
productName: SuperLocal
directories:
  output: release
afterPack: scripts/adhoc-sign.cjs
files:
  - dist/**
  - src/**
  - assets/**
  - package.json
extraResources:
  - from: binaries
    to: .
    filter:
      - superlocal
      - superlocal.exe
mac:
  icon: assets/icon.icns
  identity: null
  category: public.app-category.social-networking
  target:
    - dmg
  extendInfo:
    CFBundleDisplayName: SuperLocal
    CFBundleName: SuperLocal
dmg:
  title: SuperLocal
  icon: assets/icon.icns
artifactName: ${productName}-${version}-${arch}.${ext}
win:
  target:
    - nsis
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
